
name: Build SG Money Tracker APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SG-Money-Tracker-Source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate and extract app source
        run: |
          echo "Repository files:"
          ls -la
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE"
          echo "Extracted project files:"
          find . -maxdepth 3 -name package.json -print

      - name: Install dependencies and build web app
        working-directory: SG-Money-Tracker
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: SG-Money-Tracker/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SG-Money-Tracker-debug-APK
          path: SG-Money-Tracker/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
