name: Build SG Money Tracker APK

on:
workflow_dispatch:
push:
paths:
- 'SG-Money-Tracker-Source.zip'
- '.github/workflows/android.yml'

permissions:
contents: read

jobs:
build-apk:
runs-on: ubuntu-latest
steps:
- name: Download repository contents
uses: actions/checkout@v4

- name: Set up Java  
    uses: actions/setup-java@v4  
    with:  
      distribution: temurin  
      java-version: '21'  

  - name: Set up Node.js  
    uses: actions/setup-node@v4  
    with:  
      node-version: '20'  
      cache: npm  
      cache-dependency-path: SG-Money-Tracker/package-lock.json  
    continue-on-error: true  

  - name: Extract app source  
    run: unzip -o SG-Money-Tracker-Source.zip  

  - name: Install dependencies and build web app  
    working-directory: SG-Money-Tracker  
    run: |  
      npm install  
      npm run build  
      npx cap add android  
      npx cap sync android  

  - name: Build debug APK  
    working-directory: SG-Money-Tracker/android  
    run: |  
      chmod +x gradlew  
      ./gradlew assembleDebug  

  - name: Upload APK artifact  
    uses: actions/upload-artifact@v4  
    with:  
      name: SG-Money-Tracker-debug-APK  
      path: SG-Money-Tracker/android/app/build/outputs/apk/debug/app-debug.apk  
      if-no-files-found: error  
      retention-days: 7
